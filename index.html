<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Water Chemistry Suite</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Chart.js for graphs -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ============================================================
   DARK ENGINEERING THEME (A1)
   ============================================================ */

:root {
    --bg: #0b0f19;
    --bg2: #111827;
    --panel: #1f2937;
    --panel2: #273349;
    --accent: #38bdf8;
    --accent2: #0ea5e9;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --border: #334155;
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
    --radius: 10px;
    --sidebar-width: 260px;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* ============================================================
   SIDEBAR (D1)
   ============================================================ */

#sidebar {
    width: var(--sidebar-width);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    padding: 20px;
    display: flex;
    flex-direction: column;
}

#sidebar h1 {
    font-size: 1.4rem;
    margin: 0 0 20px 0;
    color: var(--accent);
    letter-spacing: 0.05em;
}

.nav-item {
    padding: 12px 14px;
    margin-bottom: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
}

.nav-item:hover {
    background: var(--panel2);
    border-color: var(--accent);
}

.nav-item.active {
    background: var(--panel2);
    border-color: var(--accent);
}

/* ============================================================
   MAIN CONTENT AREA
   ============================================================ */

#main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 30px;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
}

.panel h2 {
    margin-top: 0;
    color: var(--accent);
    letter-spacing: 0.04em;
}

.input-row {
    display: flex;
    gap: 20px;
    margin-bottom: 12px;
}

.input-row .input {
    flex: 1;
}

label {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
}

input, select {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 0.95rem;
}

button {
    padding: 10px 18px;
    background: var(--accent2);
    border: none;
    border-radius: var(--radius);
    color: var(--bg);
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: var(--accent);
}

/* Graph container */
.graph-container {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 20px;
}

</style>
</head>

<body>

<!-- ============================================================
     SIDEBAR NAVIGATION
     ============================================================ -->

<div id="sidebar">
    <h1>Water Chemistry Suite</h1>

    <div class="nav-item active" data-target="ph-panel">pH Calculator</div>
    <div class="nav-item" data-target="alk-panel">Alkalinity</div>
    <div class="nav-item" data-target="co2-panel">CO₂ System</div>
    <div class="nav-item" data-target="hardness-panel">Hardness</div>
    <div class="nav-item" data-target="lsi-panel">LSI / CSI</div>
    <div class="nav-item" data-target="ionic-panel">Ionic Balance</div>
    <div class="nav-item" data-target="speciation-panel">Speciation Graphs</div>
</div>

<!-- ============================================================
     MAIN CONTENT AREA
     ============================================================ -->

<div id="main">

    <!-- ========================================================
         pH CALCULATOR PANEL
         ======================================================== -->
    <div id="ph-panel" class="panel">
        <h2>pH Calculator (Full Carbonate System)</h2>

        <div class="input-row">
            <div class="input">
                <label>Total Inorganic Carbon (mol/L)</label>
                <input id="ph-ct" type="number" step="0.000001" value="0.002">
            </div>
            <div class="input">
                <label>Temperature (°C)</label>
                <input id="ph-temp" type="number" step="0.1" value="25">
            </div>
        </div>

        <div class="input-row">
            <div class="input">
                <label>Sodium Na⁺ (mol/L)</label>
                <input id="ph-na" type="number" step="0.000001" value="0.01">
            </div>
            <div class="input">
                <label>Chloride Cl⁻ (mol/L)</label>
                <input id="ph-cl" type="number" step="0.000001" value="0.01">
            </div>
        </div>

        <button onclick="runPH()">Calculate pH</button>

        <div id="ph-result" style="margin-top:20px;font-size:1.2rem;"></div>
    </div>

    <!-- ========================================================
         OTHER PANELS WILL BE INSERTED IN CHUNK 2+
         ======================================================== -->

</div>

<!-- ============================================================
     END OF CHUNK 1
     ============================================================ -->

<!-- ============================================================
     CHUNK 2 — EXTENDED ENGINEERING CSS
     (Paste directly after Chunk 1's CSS block)
     ============================================================ -->

<style>

/* ============================================================
   PANEL GRID LAYOUTS
   ============================================================ */

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
}

.grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

/* ============================================================
   RESULT BOXES
   ============================================================ */

.result-box {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-top: 12px;
}

.result-box h3 {
    margin: 0 0 10px 0;
    color: var(--accent);
    font-size: 1rem;
}

.result-value {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
}

/* ============================================================
   ALERTS
   ============================================================ */

.alert {
    padding: 12px 16px;
    border-radius: var(--radius);
    margin-top: 10px;
    font-size: 0.95rem;
}

.alert-danger {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid var(--danger);
    color: var(--danger);
}

.alert-success {
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid var(--success);
    color: var(--success);
}

.alert-warning {
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid var(--warning);
    color: var(--warning);
}

/* ============================================================
   TABLES
   ============================================================ */

.table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
}

.table th, .table td {
    padding: 10px;
    border: 1px solid var(--border);
}

.table th {
    background: var(--panel2);
    color: var(--accent);
    text-align: left;
}

.table td {
    background: var(--panel);
}

/* ============================================================
   GRAPH CONTAINERS
   ============================================================ */

.graph-container {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 20px;
}

.graph-container h3 {
    margin-top: 0;
    color: var(--accent);
}

/* ============================================================
   HIDDEN PANELS (SPA)
   ============================================================ */

.panel {
    display: none;
}

.panel.active {
    display: block;
}

/* ============================================================
   BUTTONS — SECONDARY
   ============================================================ */

.btn-secondary {
    padding: 10px 18px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    cursor: pointer;
    margin-top: 10px;
}

.btn-secondary:hover {
    border-color: var(--accent);
}

/* ============================================================
   INPUT GROUPS
   ============================================================ */

.input-group {
    margin-bottom: 14px;
}

.input-group label {
    margin-bottom: 6px;
    display: block;
    color: var(--muted);
}

.input-group input {
    width: 100%;
    padding: 10px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
}

/* ============================================================
   SECTION TITLES
   ============================================================ */

.section-title {
    margin-top: 30px;
    margin-bottom: 10px;
    font-size: 1.2rem;
    color: var(--accent);
    letter-spacing: 0.04em;
}

/* ============================================================
   FOOTER
   ============================================================ */

#footer {
    margin-top: 40px;
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
}

</style>
<!-- ============================================================
     CHUNK 3 — FULL CHEMISTRY ENGINE
     ============================================================ -->

<script>

/***************************************************************
 *  UTILITY FUNCTIONS
 ***************************************************************/

function toKelvin(Tc) {
    return Tc + 273.15;
}

function log10(x) {
    return Math.log(x) / Math.log(10);
}

/***************************************************************
 *  TEMPERATURE-CORRECTED EQUILIBRIUM CONSTANTS (Millero)
 ***************************************************************/

function carbonateConstants(Tc) {
    const T = toKelvin(Tc);

    const logK1 =
        -356.3094 - 0.06091964 * T + 21834.37 / T +
        126.8339 * log10(T) - 1684915 / (T * T);

    const logK2 =
        -107.8871 - 0.03252849 * T + 5151.79 / T +
        38.92561 * log10(T) - 563713.9 / (T * T);

    const logKw = -4470 / T + 6.0875 - 0.01706 * T;

    return {
        K1: Math.pow(10, logK1),
        K2: Math.pow(10, logK2),
        Kw: Math.pow(10, logKw)
    };
}

/***************************************************************
 *  IONIC STRENGTH
 ***************************************************************/

function ionicStrength(ions) {
    let I = 0;
    for (const ion of ions) {
        I += ion.c * ion.z * ion.z;
    }
    return 0.5 * I;
}

/***************************************************************
 *  DEBYE–HÜCKEL ACTIVITY COEFFICIENTS
 ***************************************************************/

function activityCoefficient(z, I, a = 4) {
    const A = 0.5085;
    const B = 0.3281;
    return Math.pow(10, -A * z * z * Math.sqrt(I) / (1 + B * a * Math.sqrt(I)));
}

/***************************************************************
 *  CARBONATE SPECIATION
 ***************************************************************/

function carbonateSpeciation(pH, CT, K1, K2) {
    const H = Math.pow(10, -pH);

    const denom = 1 + K1 / H + (K1 * K2) / (H * H);

    const alpha0 = 1 / denom;
    const alpha1 = (K1 / H) / denom;
    const alpha2 = (K1 * K2) / (H * H) / denom;

    return {
        CO2: alpha0 * CT,
        HCO3: alpha1 * CT,
        CO3: alpha2 * CT
    };
}

/***************************************************************
 *  CHARGE BALANCE FUNCTION
 ***************************************************************/

function chargeBalance(pH, CT, ions, K1, K2, Kw) {
    const H = Math.pow(10, -pH);
    const OH = Kw / H;

    const spec = carbonateSpeciation(pH, CT, K1, K2);

    let pos = H;
    let neg = OH + spec.HCO3 + 2 * spec.CO3;

    for (const ion of ions) {
        if (ion.z > 0) pos += ion.c * ion.z;
        else neg += ion.c * Math.abs(ion.z);
    }

    return pos - neg;
}

/***************************************************************
 *  NEWTON–RAPHSON pH SOLVER
 ***************************************************************/

function solvePH(CT, ions, T) {
    const { K1, K2, Kw } = carbonateConstants(T);

    let pH = 7.0;

    for (let i = 0; i < 20; i++) {
        const f = chargeBalance(pH, CT, ions, K1, K2, Kw);

        const dp = 0.0001;
        const f2 = chargeBalance(pH + dp, CT, ions, K1, K2, Kw);
        const df = (f2 - f) / dp;

        const newPH = pH - f / df;

        if (Math.abs(newPH - pH) < 1e-6) {
            pH = newPH;
            break;
        }
        pH = newPH;
    }

    const H = Math.pow(10, -pH);
    const OH = Kw / H;
    const spec = carbonateSpeciation(pH, CT, K1, K2);

    return {
        pH,
        H,
        OH,
        CO2: spec.CO2,
        HCO3: spec.HCO3,
        CO3: spec.CO3,
        K1,
        K2,
        Kw
    };
}

/***************************************************************
 *  ALKALINITY CALCULATOR
 ***************************************************************/

function calcAlkalinity(pH, CT, K1, K2, Kw) {
    const H = Math.pow(10, -pH);
    const OH = Kw / H;

    const spec = carbonateSpeciation(pH, CT, K1, K2);

    return spec.HCO3 + 2 * spec.CO3 + OH - H;
}

/***************************************************************
 *  CO₂ EQUILIBRIUM CALCULATOR
 ***************************************************************/

function calcCO2FromPH(pH, CT, K1, K2) {
    const H = Math.pow(10, -pH);
    const spec = carbonateSpeciation(pH, CT, K1, K2);
    return spec.CO2;
}

/***************************************************************
 *  HARDNESS CALCULATOR
 ***************************************************************/

function calcHardness(Ca, Mg) {
    return (Ca * 2 + Mg * 2); // eq/L
}

/***************************************************************
 *  LSI / CSI SATURATION INDEX ENGINE
 ***************************************************************/

function calcLSI(pH, Ca, Alk, T) {
    const Tk = toKelvin(T);

    const pCa = -log10(Ca);
    const pAlk = -log10(Alk);

    const pKs = ( -171.9065 - 0.077993 * Tk + 2839.319 / Tk + 71.595 * log10(Tk) );

    const pHs = pKs + pCa + pAlk;

    return pH - pHs;
}

function calcCSI(pH, Ca, Alk, T) {
    return calcLSI(pH, Ca, Alk, T);
}

/***************************************************************
 *  IONIC BALANCE CHECKER
 ***************************************************************/

function ionicBalance(ions) {
    let pos = 0;
    let neg = 0;

    for (const ion of ions) {
        if (ion.z > 0) pos += ion.c * ion.z;
        else neg += ion.c * Math.abs(ion.z);
    }

    return {
        positive: pos,
        negative: neg,
        balance: pos - neg
    };
}

/***************************************************************
 *  EXPORT ENGINE FOR UI
 ***************************************************************/

window.ChemEngine = {
    carbonateConstants,
    ionicStrength,
    activityCoefficient,
    carbonateSpeciation,
    chargeBalance,
    solvePH,
    calcAlkalinity,
    calcCO2FromPH,
    calcHardness,
    calcLSI,
    calcCSI,
    ionicBalance
};

</script>
<!-- ============================================================
     CHUNK 4 — CALCULATOR UI LOGIC + SPA NAVIGATION
     ============================================================ -->

<script>

/***************************************************************
 *  SPA NAVIGATION — FIXED SIDEBAR (D1)
 ***************************************************************/

const navItems = document.querySelectorAll('.nav-item');
const panels = document.querySelectorAll('.panel');

navItems.forEach(item => {
    item.addEventListener('click', () => {
        navItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');

        const target = item.getAttribute('data-target');

        panels.forEach(p => {
            if (p.id === target) p.classList.add('active');
            else p.classList.remove('active');
        });
    });
});

/***************************************************************
 *  pH CALCULATOR UI
 ***************************************************************/

function runPH() {
    const CT = parseFloat(document.getElementById('ph-ct').value);
    const T = parseFloat(document.getElementById('ph-temp').value);
    const Na = parseFloat(document.getElementById('ph-na').value);
    const Cl = parseFloat(document.getElementById('ph-cl').value);

    const ions = [
        { c: Na, z: +1 },
        { c: Cl, z: -1 }
    ];

    const result = ChemEngine.solvePH(CT, ions, T);

    document.getElementById('ph-result').innerHTML = `
        <div class="result-box">
            <h3>Calculated pH</h3>
            <div class="result-value">${result.pH.toFixed(4)}</div>

            <h3>Species</h3>
            CO₂(aq): ${result.CO2.toExponential(3)} mol/L<br>
            HCO₃⁻: ${result.HCO3.toExponential(3)} mol/L<br>
            CO₃²⁻: ${result.CO3.toExponential(3)} mol/L<br>

            <h3>Constants</h3>
            K₁: ${result.K1.toExponential(3)}<br>
            K₂: ${result.K2.toExponential(3)}<br>
            Kw: ${result.Kw.toExponential(3)}<br>
        </div>
    `;
}

/***************************************************************
 *  ALKALINITY PANEL
 ***************************************************************/

function runAlkalinity() {
    const pH = parseFloat(document.getElementById('alk-ph').value);
    const CT = parseFloat(document.getElementById('alk-ct').value);
    const T = parseFloat(document.getElementById('alk-temp').value);

    const { K1, K2, Kw } = ChemEngine.carbonateConstants(T);

    const Alk = ChemEngine.calcAlkalinity(pH, CT, K1, K2, Kw);

    document.getElementById('alk-result').innerHTML = `
        <div class="result-box">
            <h3>Total Alkalinity</h3>
            <div class="result-value">${Alk.toExponential(3)} eq/L</div>
        </div>
    `;
}

/***************************************************************
 *  CO₂ PANEL
 ***************************************************************/

function runCO2() {
    const pH = parseFloat(document.getElementById('co2-ph').value);
    const CT = parseFloat(document.getElementById('co2-ct').value);
    const T = parseFloat(document.getElementById('co2-temp').value);

    const { K1, K2 } = ChemEngine.carbonateConstants(T);

    const CO2 = ChemEngine.calcCO2FromPH(pH, CT, K1, K2);

    document.getElementById('co2-result').innerHTML = `
        <div class="result-box">
            <h3>CO₂(aq)</h3>
            <div class="result-value">${CO2.toExponential(3)} mol/L</div>
        </div>
    `;
}

/***************************************************************
 *  HARDNESS PANEL
 ***************************************************************/

function runHardness() {
    const Ca = parseFloat(document.getElementById('hard-ca').value);
    const Mg = parseFloat(document.getElementById('hard-mg').value);

    const Hard = ChemEngine.calcHardness(Ca, Mg);

    document.getElementById('hard-result').innerHTML = `
        <div class="result-box">
            <h3>Total Hardness</h3>
            <div class="result-value">${Hard.toFixed(4)} eq/L</div>
        </div>
    `;
}

/***************************************************************
 *  LSI / CSI PANEL
 ***************************************************************/

function runLSI() {
    const pH = parseFloat(document.getElementById('lsi-ph').value);
    const Ca = parseFloat(document.getElementById('lsi-ca').value);
    const Alk = parseFloat(document.getElementById('lsi-alk').value);
    const T = parseFloat(document.getElementById('lsi-temp').value);

    const LSI = ChemEngine.calcLSI(pH, Ca, Alk, T);
    const CSI = ChemEngine.calcCSI(pH, Ca, Alk, T);

    document.getElementById('lsi-result').innerHTML = `
        <div class="result-box">
            <h3>LSI</h3>
            <div class="result-value">${LSI.toFixed(4)}</div>

            <h3>CSI</h3>
            <div class="result-value">${CSI.toFixed(4)}</div>
        </div>
    `;
}

/***************************************************************
 *  IONIC BALANCE PANEL
 ***************************************************************/

function runIonicBalance() {
    const Na = parseFloat(document.getElementById('ionic-na').value);
    const Ca = parseFloat(document.getElementById('ionic-ca').value);
    const Mg = parseFloat(document.getElementById('ionic-mg').value);
    const Cl = parseFloat(document.getElementById('ionic-cl').value);
    const SO4 = parseFloat(document.getElementById('ionic-so4').value);

    const ions = [
        { c: Na, z: +1 },
        { c: Ca, z: +2 },
        { c: Mg, z: +2 },
        { c: Cl, z: -1 },
        { c: SO4, z: -2 }
    ];

    const bal = ChemEngine.ionicBalance(ions);

    document.getElementById('ionic-result').innerHTML = `
        <div class="result-box">
            <h3>Ionic Balance</h3>
            Positive: ${bal.positive.toFixed(4)} eq/L<br>
            Negative: ${bal.negative.toFixed(4)} eq/L<br>
            <h3>Difference</h3>
            <div class="result-value">${bal.balance.toFixed(4)} eq/L</div>
        </div>
    `;
}

</script>
<!-- ============================================================
     CHUNK 5 — GRAPH SYSTEM (Chart.js)
     ============================================================ -->

<script>

/***************************************************************
 *  CREATE CANVAS ELEMENTS FOR GRAPHS
 ***************************************************************/

const speciationPanelHTML = `
    <div class="panel" id="speciation-panel">
        <h2>Speciation Graphs</h2>

        <div class="input-row">
            <div class="input">
                <label>Total Inorganic Carbon (mol/L)</label>
                <input id="spec-ct" type="number" step="0.000001" value="0.002">
            </div>
            <div class="input">
                <label>Temperature (°C)</label>
                <input id="spec-temp" type="number" step="0.1" value="25">
            </div>
        </div>

        <button onclick="runSpeciationGraph()">Generate Graph</button>

        <div class="graph-container">
            <h3>Carbonate Speciation vs pH</h3>
            <canvas id="speciationChart"></canvas>
        </div>

        <div class="graph-container">
            <h3>pH vs Alkalinity</h3>
            <canvas id="alkChart"></canvas>
        </div>

        <div class="graph-container">
            <h3>pH vs CO₂(aq)</h3>
            <canvas id="co2Chart"></canvas>
        </div>
    </div>
`;

document.getElementById("main").insertAdjacentHTML("beforeend", speciationPanelHTML);

/***************************************************************
 *  GRAPH VARIABLES
 ***************************************************************/

let speciationChart = null;
let alkChart = null;
let co2Chart = null;

/***************************************************************
 *  GENERATE SPECIATION GRAPH
 ***************************************************************/

function runSpeciationGraph() {
    const CT = parseFloat(document.getElementById('spec-ct').value);
    const T = parseFloat(document.getElementById('spec-temp').value);

    const { K1, K2, Kw } = ChemEngine.carbonateConstants(T);

    const pH_values = [];
    const CO2_values = [];
    const HCO3_values = [];
    const CO3_values = [];
    const Alk_values = [];
    const CO2aq_values = [];

    for (let pH = 4; pH <= 12; pH += 0.1) {
        const spec = ChemEngine.carbonateSpeciation(pH, CT, K1, K2);
        const Alk = ChemEngine.calcAlkalinity(pH, CT, K1, K2, Kw);
        const CO2aq = ChemEngine.calcCO2FromPH(pH, CT, K1, K2);

        pH_values.push(pH);
        CO2_values.push(spec.CO2);
        HCO3_values.push(spec.HCO3);
        CO3_values.push(spec.CO3);
        Alk_values.push(Alk);
        CO2aq_values.push(CO2aq);
    }

    /***********************************************************
     *  Destroy old charts if they exist
     ***********************************************************/
    if (speciationChart) speciationChart.destroy();
    if (alkChart) alkChart.destroy();
    if (co2Chart) co2Chart.destroy();

    /***********************************************************
     *  Speciation Chart
     ***********************************************************/
    const ctx1 = document.getElementById('speciationChart').getContext('2d');
    speciationChart = new Chart(ctx1, {
        type: 'line',
        data: {
            labels: pH_values,
            datasets: [
                {
                    label: 'CO₂(aq)',
                    data: CO2_values,
                    borderColor: '#38bdf8',
                    borderWidth: 2,
                    fill: false
